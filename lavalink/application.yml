server:
  port: 2333
  address: 127.0.0.1

lavalink:
  plugins:
    # LavaSrc — Spotify, Apple Music metadata → resolves to SoundCloud/other streams
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
    # NO youtube-plugin — YouTube actively blocks bots

  server:
    password: "kurumi-music-2024"
    sources:
      youtube: false    # Blocked by YouTube — don't use
      bandcamp: true
      soundcloud:
        enabled: true
        filterPreviewTracks: true  # Primary streaming source
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    playerUpdateInterval: 3
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  lavasrc:
    providers:
      # Search order: SoundCloud first (actual streams), then fallback
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: true
      deezer: false
      yandexmusic: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 100
      albumLoadLimit: 100
    applemusic:
      countryCode: "US"
    deezer:
      countryCode: "US"
      masterDecryptionKey: ""

logging:
  file:
    max-history: 7
    max-size: 10MB
  level:
    root: INFO
    lavalink: DEBUG
    com.sedmelluq.discord.lavaplayer.source.soundcloud: DEBUG

metrics:
  prometheus:
    enabled: false
