# Optional Render Blueprint: Dashboard → New → Blueprint → connect this repo.
# After first deploy, set DISCORD_TOKEN in the service Environment (secret).

services:
  - type: web
    name: kurumi-voice-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DISCORD_TOKEN
        sync: false
      - key: OLLAMA_ENABLED
        value: "1"
      - key: OLLAMA_MODEL
        value: "kurumi"
      # Set in dashboard: Tailscale IP, Cloudflare tunnel URL, or VPS (see docs/ollama-remote.md)
      - key: OLLAMA_HOST
        sync: false
      - key: OLLAMA_TIMEOUT_MS
        value: "120000"
